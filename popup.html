<!DOCTYPE html>
<html>

<head>
    <title>AI Bookmark</title>
</head>

<body>

    <h1>AI Bookmark</h1>

    <button id="getPageData">
        Save Current Page
    </button>

    <h3 id="pageTitle"></h3>

    <hr>

    <h2>My Bookmarks</h2>

    <button id="getBookmarks">
        View Bookmarks
    </button>

    <div id="bookmarks"></div>

    <hr>

    <h2>Search</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search bookmarks..."
    >
    <br><br>

    <button id="searchButton">
        Keyword search
    </button>
    <button id="semanticSearchButton">
        AI Search
    </button>

    <div id="searchResults"></div>

    <script src="popup.js"></script>

</body>

</html>
